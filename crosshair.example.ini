; ============================================================
;  Crosshair Overlay — example configuration
;  Copy this file to crosshair.ini next to the executable,
;  then press F10 in the app (or restart it).
; ============================================================

; ---- colours (F9 cycles through them) ----
Colors=#00FF00,#FF3B30,#00E5FF,#00FF00,#FFFFFF

; ---- shape: cross | dot | circle | x | t ----
Shape=cross

; ---- outline ----
; Outline=0 disables it. OutlineMode=1 draws the outline on the long
; sides only (no end caps, keeps the centre gap clean).
Outline=1
OutlineColor=#000000
OutlineMode=1

; ---- opacity 0-255 ----
Alpha=255

; ---- monitor index (0 = primary) ----
Screen=0

; ---- 1 = round geometry to whole canvas pixels, 0 = allow sub-pixel ----
PixelSnap=0

; ---- transparency: 0 = colour key (most compatible), 1 = per-pixel alpha
;      Changing this requires restarting the application. ----
AlphaMode=1

; ---- 0 = nearest upscale (crisp), 1 = bilinear (soft) ----
Upscale=1

; ---- halo around the crosshair, 0-100, per-pixel alpha only ----
Glow=0

; ---- legacy 1-bit soft edge, only useful with AlphaMode=0 ----
SoftEdge=0

; ---- keep horizontal and vertical values in sync ----
SyncArms=1

; ---- canvas: the resolution the crosshair is designed in ----
CanvasWidth=800
CanvasHeight=600
CanvasFit=stretch
CanvasPresets=800x600,1024x768,1280x720,1920x1080,2560x1440,native
AnchorX=50
AnchorY=50

; ---- crosshair geometry, in canvas pixels ----
SizeX=6
SizeY=10
ThicknessX=2
ThicknessY=2
GapX=4
GapY=4

; ---- hotkeys ----
KeySettings=F6
KeyCanvas=F7
KeyToggle=F8
KeyColor=F9
KeyReload=F10
KeyExit=Ctrl+Alt+Q
